<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">\n<link rel="icon" href="icon.svg" type="image/svg+xml">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="RegieFlow">
<title>RegieFlow</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f6f7;--accent:#111827;--line:#e5e7eb;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;background:#f5f6f7}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:20px}.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden}.mark img{width:100%;height:100%;object-fit:contain;background:white}
.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;font-weight:750;color:#4b5563;margin:2px 0}.nav button.active,.nav button:hover{background:#f1f3f5;color:#111827}
.main{min-width:0}.top{height:64px;border-bottom:1px solid var(--line);background:#fafafa;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.content{padding:22px;max-width:1180px;margin:auto}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.hero{background:var(--accent);color:#fff;border-radius:20px;padding:24px}.metric{font-size:30px;font-weight:900}
.btn{border:1px solid #d1d5db;background:#fff;color:#111827;border-radius:10px;padding:10px 14px;font-weight:800}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:#b42318}
.input,.area,.select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:#111827}.area{min-height:110px;resize:vertical}.field{margin:13px 0}.label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.labelrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.labelrow .label{margin:0}.info-btn{width:22px;height:22px;border:1px solid #cbd5e1;border-radius:50%;background:#fff;color:#475569;display:inline-grid;place-items:center;font-size:12px;font-weight:900;padding:0;line-height:1}.info-btn:hover{background:#f8fafc;color:#111827}.field-help{margin-top:7px;padding:9px 10px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:12px;line-height:1.4}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.between{display:flex;gap:10px;align-items:center;justify-content:space-between}.status{display:inline-flex;padding:5px 9px;border-radius:99px;background:#f3f4f6;font-size:12px;font-weight:850}.approved,.closed{background:#e8f7ef;color:#147a45}.rejected{background:#feeceb;color:#b42318}.awaiting_customer,.internal_review,.awaiting_rapport{background:#fff7db;color:#8a6400}
.notice{padding:12px 13px;border-radius:12px;background:#eef6ff;color:#234e80}.notice.warn{background:#fff7db;color:#7a5b00}.notice.ok{background:#e9f7ef;color:#11663a}.notice.bad{background:#feeceb;color:#9f1b12}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.click{cursor:pointer}.click:hover{background:#fafafa}.tablewrap{overflow:auto}
.auth{max-width:480px;margin:6vh auto;padding:18px}.auth .card{padding:24px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo-grid img{width:100%;height:165px;object-fit:cover;border:1px solid var(--line);border-radius:12px}
.modalbg{position:fixed;inset:0;background:#0f172a70;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.sig{width:100%;height:180px;border:1px solid #cbd5e1;border-radius:12px;touch-action:none;background:#fff}
.toast{position:fixed;right:18px;bottom:18px;z-index:99;background:#111827;color:white;padding:12px 15px;border-radius:12px;box-shadow:0 12px 30px #0003;max-width:380px}.notif-list{margin-top:8px}.notif-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 4px;cursor:pointer;color:inherit}.notif-item:hover{background:#f8fafc}.notif-item:last-child{border-bottom:0}.notif-item.unread .notif-title:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:2px}.notif-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.notif-arrow{font-size:20px;color:#94a3b8;line-height:1}.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;background:#111827;color:#fff;border-radius:10px;font-size:11px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;background:#f3f4f6;padding:10px;border-radius:9px}.empty{text-align:center;color:#6b7280;padding:32px}.mobilebar{display:none}
@media(max-width:800px){.shell{display:block}.side{display:none}.desktop-only{display:none!important}.top{padding:0 10px;gap:8px}.top>strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}.top>.row{gap:6px}.ctx-switch{max-width:115px!important;font-size:12px;padding:7px 20px 7px 7px!important}.top .btn{padding:8px 9px}.content{padding:14px 14px 82px}.g2,.g3,.g4{grid-template-columns:1fr}.photo-grid{grid-template-columns:1fr 1fr}.mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px max(6px,env(safe-area-inset-bottom))}.mobilebar button{border:0;background:transparent;font-size:11px;font-weight:800;padding:8px 5px}.modalbg{padding:8px;align-items:flex-end}.modal{border-radius:18px 18px 0 0;max-height:94vh}.photo-grid img{height:130px}.auth{margin:2vh auto}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script type="module" src="app.js"></script>
</body></html>
